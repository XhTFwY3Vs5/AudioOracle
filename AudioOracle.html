<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Oracle</title>
    <style>
        /* A simple CSS reset and better box-sizing */
        :root {
            --spacing-small: 8px;
            --spacing-medium: 16px;
            --spacing-large: 24px;
            --border-radius: 5px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: var(--spacing-medium);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Main container for content */
        .container {
            width: 100%;
            max-width: 600px; /* Prevents it from becoming too wide on desktops */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-large); /* Consistent spacing between all direct children */
        }

        .logo {
            width: 120px;
            height: 120px;
        }

        #result {
            font-size: 2em;
            font-weight: bold;
            color: #444;
            text-align: center;
        }

        /* Form styling */
        .oracle-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-medium); /* Consistent spacing between form groups */
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-small);
        }

        label {
            font-size: 1.1em;
            font-weight: 500;
        }
        
        /* Styles for text inputs and the larger textarea */
        input, textarea {
            width: 100%; /* Make inputs and textarea responsive */
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: var(--border-radius);
            background-color: #fff;
        }
        
        textarea {
            min-height: 200px; /* Made the textarea significantly taller */
            resize: vertical; /* Allow user to resize it vertically */
        }
        
        button {
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #countdown {
            font-size: 1.5em;
            font-weight: 500;
            color: #555;
        }
    </style>
</head>
<body>

    <main class="container">
        
        <img src="img/audioOracleLogo.webp" alt="Audio Oracle Logo" class="logo">
        
        <div id="result">Press Start</div>
        
        <form class="oracle-form" onsubmit="return false;">
            <div class="form-group">
                <label for="interval">Delay between rolls (seconds):</label>
                <input id="interval" type="number" value="20" min="1">
            </div>

            <div class="form-group">
                <label for="phrases">Enter phrases (one per line):</label>
                <textarea id="phrases" rows="10">no, and...
no
no, but...
yes, but...
yes
yes, and...</textarea>
            </div>
            
            <div class="form-group">
                <label for="timer">Stop after (minutes, 0 for unlimited):</label>
                <input id="timer" type="number" value="0" min="0">
            </div>
            
            <button onclick="toggleRolling()">Start Rolling</button>
        </form>

        <div id="countdown"></div>

    </main>

    <script>
        // Caching DOM elements for better performance
        const resultDiv = document.getElementById('result');
        const intervalInput = document.getElementById('interval');
        const phrasesTextarea = document.getElementById('phrases');
        const timerInput = document.getElementById('timer');
        const countdownDiv = document.getElementById('countdown');
        const toggleButton = document.querySelector('button');

        let isRolling = false;
        let intervalId;
        let timerId;
        let countdownId;
        let wakeLock = null; // Store the WakeLockSentinel object

        document.addEventListener('DOMContentLoaded', () => {
            // Load saved settings from localStorage
            intervalInput.value = localStorage.getItem('interval') || '20';
            phrasesTextarea.value = localStorage.getItem('phrases') || 'no, and...\nno\nno, but...\nyes, but...\nyes\nyes, and...';
            timerInput.value = localStorage.getItem('timer') || '0';
        });

        function getPhrases() {
            return phrasesTextarea.value.split('\n').filter(phrase => phrase.trim() !== '');
        }

        function rollDice() {
            const phrases = getPhrases();
            if (phrases.length === 0) {
                resultDiv.textContent = "Add phrases!";
                return;
            }
            const roll = Math.floor(Math.random() * phrases.length);
            const phrase = phrases[roll];
            resultDiv.textContent = `${phrase}`;
            speakPhrase(phrase);
        }

        function speakPhrase(phrase) {
            const utterance = new SpeechSynthesisUtterance(phrase);
            speechSynthesis.speak(utterance);
        }
        
        async function releaseWakeLock() {
            if (wakeLock) {
                await wakeLock.release();
                wakeLock = null;
                console.log('Wake lock released');
            }
        }

        function stopAllTimers() {
            clearInterval(intervalId);
            clearTimeout(timerId);
            clearInterval(countdownId);
            toggleButton.textContent = "Start Rolling";
            resultDiv.textContent = "Stopped";
            countdownDiv.textContent = "";
            isRolling = false;
            releaseWakeLock();
        }

        function toggleRolling() {
            if (isRolling) {
                stopAllTimers();
            } else {
                isRolling = true;
                // Save settings to localStorage on start
                localStorage.setItem('interval', intervalInput.value);
                localStorage.setItem('phrases', phrasesTextarea.value);
                localStorage.setItem('timer', timerInput.value);

                const delay = Math.max(1, parseInt(intervalInput.value, 10)) * 1000;
                const timerDuration = Math.max(0, parseInt(timerInput.value, 10)) * 60000;
                
                rollDice(); // Roll immediately on start
                intervalId = setInterval(rollDice, delay);
                toggleButton.textContent = "Stop Rolling";

                if (timerDuration > 0) {
                    const endTime = Date.now() + timerDuration;
                    countdownId = setInterval(() => {
                        const remainingTime = endTime - Date.now();
                        if (remainingTime <= 0) {
                            stopAllTimers();
                        } else {
                            const minutes = Math.floor((remainingTime % 3600000) / 60000);
                            const seconds = Math.floor((remainingTime % 60000) / 1000);
                            countdownDiv.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                        }
                    }, 1000);
                }

                // Request a screen wake lock
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').then(sentinel => {
                        wakeLock = sentinel;
                        console.log('Wake lock acquired');
                    }).catch(err => {
                        console.error('Failed to acquire wake lock:', err);
                    });
                }
            }
        }
    </script>
</body>
</html>
